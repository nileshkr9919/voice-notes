name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: ./build.sh --dist
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes
          path: build/VoiceNotes-*.zip
